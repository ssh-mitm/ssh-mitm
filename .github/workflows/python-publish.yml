name: Upload Python Package

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.x'
    - name: Install hash-verified build dependencies
      run: |
        python -m pip install pip==26.2.1
        pip install --require-hashes -r requirements-build.txt
        pip install build==1.6.0
    - name: Build sdist
      run: python -m build --sdist --no-isolation
    - name: Build hash-verified, reproducible wheel
      run: pip wheel --build-constraint requirements-build.txt --no-deps -w dist .
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ssh-mitm
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)

    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
