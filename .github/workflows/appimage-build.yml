name: AppImage build

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install pip==26.2.1
        python -m pip install --require-hashes -r pylock.ci.toml
    - name: Verify the AppImage build is reproducible
      if: github.event_name == 'release'
      run: packaging/verify-appimage-reproducible-build.sh
    - name: Build AppImage
      run: hatch run appimage:build
    - name: Generate checksum
      run: |
        cd dist
        sha256sum ssh-mitm-x86_64.AppImage > ssh-mitm-x86_64.AppImage.sha256
        cat ssh-mitm-x86_64.AppImage.sha256
    - name: Upload release assets
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "${{ github.event.release.tag_name }}" \
          dist/ssh-mitm-x86_64.AppImage \
          dist/ssh-mitm-x86_64.AppImage.zsync \
          dist/ssh-mitm-x86_64.AppImage.sha256 \
          --repo "${{ github.repository }}"
