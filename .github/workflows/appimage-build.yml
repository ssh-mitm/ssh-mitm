name: AppImage build

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: DEBUG cpu flags
      run: grep '^flags' /proc/cpuinfo | head -1 | tr ' ' '\n' | grep -E '^(bmi1|bmi2|avx2|avx512|sse2|sse4)'
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install hatch
    - name: Build AppImage
      run: hatch run appimage:build
    - name: DEBUG sorted rebuild for repro investigation
      run: |
        find build/AppDir -mindepth 1 | sed "s|^build/AppDir/||" | sort > /tmp/sortfile-paths.txt
        python3 -c "
        paths = [l.rstrip(chr(10)) for l in open('/tmp/sortfile-paths.txt')]
        with open('/tmp/sortfile.txt', 'w') as out:
            for i, p in enumerate(paths, start=1):
                escaped = p.replace(chr(92), chr(92)*2).replace(' ', chr(92)+' ')
                out.write(f'{escaped} {i}' + chr(10))
        "
        chmod +x build/appimagetool-x86_64.AppImage
        SOURCE_DATE_EPOCH=0 build/appimagetool-x86_64.AppImage \
          --runtime-file build/runtime-x86_64 \
          -u "gh-releases-zsync|ssh-mitm|ssh-mitm|latest|ssh-mitm-x86_64.AppImage.zsync" \
          --mksquashfs-opt "-sort" --mksquashfs-opt "/tmp/sortfile.txt" \
          build/AppDir /tmp/ssh-mitm-sorted.AppImage
        sha256sum /tmp/ssh-mitm-sorted.AppImage
    - name: Generate checksums
      run: |
        cd dist
        sha256sum ssh-mitm-x86_64.AppImage ssh-mitm-x86_64.AppImage.zsync > SHA256SUMS
        cat SHA256SUMS
    - name: Upload release assets
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "${{ github.event.release.tag_name }}" \
          dist/ssh-mitm-x86_64.AppImage \
          dist/ssh-mitm-x86_64.AppImage.zsync \
          dist/SHA256SUMS \
          --repo "${{ github.repository }}"
