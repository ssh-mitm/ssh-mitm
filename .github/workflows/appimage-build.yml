name: AppImage build

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install hatch
    - name: Build AppImage
      run: hatch run appimage:build
    - name: DEBUG build mksquashfs against fresh zstd 1.5.7
      run: |
        sudo apt-get update -q && sudo apt-get install -y -q build-essential
        mkdir -p /tmp/mksq-build && cd /tmp/mksq-build
        wget -q https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz
        tar xzf zstd-1.5.7.tar.gz
        make -C zstd-1.5.7/lib -j"$(nproc)" libzstd.a
        git clone --quiet --depth 1 --branch 4.6.1 https://github.com/plougher/squashfs-tools.git
        cd squashfs-tools/squashfs-tools
        make -j"$(nproc)" GZIP_SUPPORT=0 XZ_SUPPORT=0 LZO_SUPPORT=0 LZ4_SUPPORT=0 ZSTD_SUPPORT=1 COMP_DEFAULT=zstd \
          EXTRA_CFLAGS="-I/tmp/mksq-build/zstd-1.5.7/lib" \
          LDFLAGS="-static -L/tmp/mksq-build/zstd-1.5.7/lib" \
          mksquashfs
        ./mksquashfs -version | head -1
    - name: DEBUG rebuild ssh-mitm AppImage with fresh mksquashfs
      run: |
        rm -rf squashfs-root
        chmod +x build/appimagetool-x86_64.AppImage
        build/appimagetool-x86_64.AppImage --appimage-extract > /dev/null
        cp /tmp/mksq-build/squashfs-tools/squashfs-tools/mksquashfs squashfs-root/usr/bin/mksquashfs
        chmod +x squashfs-root/usr/bin/mksquashfs
        SOURCE_DATE_EPOCH=0 squashfs-root/AppRun \
          --runtime-file build/runtime-x86_64 \
          -u "gh-releases-zsync|ssh-mitm|ssh-mitm|latest|ssh-mitm-x86_64.AppImage.zsync" \
          build/AppDir /tmp/ssh-mitm-newzstd.AppImage
        sha256sum /tmp/ssh-mitm-newzstd.AppImage
    - name: DEBUG upload CI-built mksquashfs binary
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: debug-mksquashfs
        path: /tmp/mksq-build/squashfs-tools/squashfs-tools/mksquashfs
        retention-days: 1
    - name: Generate checksums
      run: |
        cd dist
        sha256sum ssh-mitm-x86_64.AppImage ssh-mitm-x86_64.AppImage.zsync > SHA256SUMS
        cat SHA256SUMS
    - name: Upload release assets
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "${{ github.event.release.tag_name }}" \
          dist/ssh-mitm-x86_64.AppImage \
          dist/ssh-mitm-x86_64.AppImage.zsync \
          dist/SHA256SUMS \
          --repo "${{ github.repository }}"
