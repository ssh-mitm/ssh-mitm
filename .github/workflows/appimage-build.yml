name: AppImage build

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install hatch
    - name: Build AppImage
      run: hatch run appimage:build
    - name: Generate checksums
      run: |
        cd dist
        sha256sum ssh-mitm-x86_64.AppImage ssh-mitm-x86_64.AppImage.zsync > SHA256SUMS
        cat SHA256SUMS
    - name: DEBUG upload for cross-machine repro investigation
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: debug-appimage
        path: dist/ssh-mitm-x86_64.AppImage
        retention-days: 1
    - name: Upload release assets
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "${{ github.event.release.tag_name }}" \
          dist/ssh-mitm-x86_64.AppImage \
          dist/ssh-mitm-x86_64.AppImage.zsync \
          dist/SHA256SUMS \
          --repo "${{ github.repository }}"
