[build-system]
requires = ["hatchling==1.32.0", "hatch-requirements-txt==0.4.1"]
build-backend = "hatchling.build"

[project]
name = "ssh-mitm"
dynamic = ["version", "dependencies", "optional-dependencies"]
authors = [
    {name = "SSH-MITM Dev-Team", email = "support@ssh-mitm.at"}
]
maintainers = [
  {name = "Manfred Kaiser", email = "manfred.kaiser@ssh-mitm.at"}
]
description = "ssh mitm server for security audits supporting publickey authentication, session hijacking and file manipulation"
readme = "README.md"
license = {file = "LICENSE"}
keywords = [
    "ssh",
    "proxy",
    "mitm",
    "network",
    "security",
    "audit",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: System :: Networking",
    "Development Status :: 5 - Production/Stable",
]
requires-python = ">= 3.11"

[project.urls]
Homepage = "https://www.ssh-mitm.at"
Documentation = "https://docs.ssh-mitm.at"
Changelog = "https://github.com/ssh-mitm/ssh-mitm/blob/master/CHANGELOG.md"
Source = "https://github.com/ssh-mitm/ssh-mitm"
Tracker = "https://github.com/ssh-mitm/ssh-mitm/issues"

[project.scripts]
ssh-mitm = "sshmitm.cli:main"
ssh-mitm-askpass = "sshmitm.tools.askpass:main"

[project.entry-points."sshmitm.SubCommand"]
server = "sshmitm.server.cli:SSHServerModules"
audit = "sshmitm.audit.cli:Audit"
check-publickey = "sshmitm.commands.check_publickey:CheckPublickey"
mosh = "sshmitm.apps.mosh.client:Mosh"
tutorial = "sshmitm.tutorial.cli:Tutorial"

[project.entry-points."sshmitm.AgentBaseForwarder"]
base = "sshmitm.forwarders.agent:AgentForwarder"

[project.entry-points."sshmitm.BaseSession"]
base = "sshmitm.session:Session"

[project.entry-points."sshmitm.Authenticator"]
passthrough = "sshmitm.authentication:AuthenticatorPassThrough"
remoteauth = "sshmitm.authentication:AuthenticatorRemote"

[project.entry-points."sshmitm.BaseServerInterface"]
base = "sshmitm.interfaces.server:ServerInterface"

[project.entry-points."sshmitm.SSHBaseForwarder"]
mirrorshell = "sshmitm.plugins.ssh.mirrorshell:SSHMirrorForwarder"

[project.entry-points."sshmitm.SCPBaseForwarder"]
debug_traffic = "sshmitm.plugins.scp.debug_traffic:SCPDebugForwarder"
inject_file = "sshmitm.plugins.scp.inject_file:SCPInjectFile"
replace_file = "sshmitm.plugins.scp.replace_file:SCPReplaceFile"
store_file = "sshmitm.plugins.scp.store_file:SCPStorageForwarder"
replace-command = "sshmitm.plugins.scp.rewrite_command:SCPRewriteCommand"
CVE-2022-29154 = "sshmitm.plugins.scp.cve202229154:CVE202229154"

[project.entry-points."sshmitm.NetconfBaseForwarder"]
base = "sshmitm.forwarders.netconf:NetconfForwarder"
log-session = "sshmitm.plugins.netconf.log_session:NetconfLoggingForwarder"

[project.entry-points."sshmitm.PowerShellBaseForwarder"]
base = "sshmitm.forwarders.powershell:PowerShellForwarder"
log-session = "sshmitm.plugins.powershell.log_session:PSRPLoggingForwarder"

[project.entry-points."sshmitm.BaseSFTPServerInterface"]
base = "sshmitm.interfaces.sftp:SFTPProxyServerInterface"

[project.entry-points."sshmitm.SFTPHandlerBasePlugin"]
replace_file = "sshmitm.plugins.sftp.replace_file:SFTPProxyReplaceHandler"
store_file = "sshmitm.plugins.sftp.store_file:SFTPHandlerStoragePlugin"
check_file = "sshmitm.plugins.sftp.check_file:SFTPHandlerCheckFilePlugin"

[project.entry-points."sshmitm.RemotePortForwardingBaseForwarder"]
inject = "sshmitm.plugins.tunnel.injectservertunnel:InjectableRemotePortForwardingForwarder"

[project.entry-points."sshmitm.LocalPortForwardingBaseForwarder"]
socks = "sshmitm.plugins.tunnel.socks:SOCKSTunnelForwarder"

[project.entry-points."sshmitm.ExecHandler"]
mosh = "sshmitm.apps.mosh.forwarder:MoshForwarder"

[project.entry-points."sshmitm.Tutorial"]
00-host-key-verification = "sshmitm.tutorial.tutorials.host_key_verification:HostKeyVerificationTutorial"
01-password-auth = "sshmitm.tutorial.tutorials.password_auth:PasswordAuthTutorial"
02-pubkey-agent-forwarding = "sshmitm.tutorial.tutorials.pubkey_agent_forwarding:PubkeyAgentForwardingTutorial"
03-sftp-download = "sshmitm.tutorial.tutorials.sftp_download:SFTPDownloadTutorial"
04-ssh-exec = "sshmitm.tutorial.tutorials.ssh_exec:SSHExecTutorial"
05-mirrorshell = "sshmitm.tutorial.tutorials.mirrorshell:MirrorshellTutorial"
06-pubkey-enumeration = "sshmitm.tutorial.tutorials.pubkey_enumeration:PubkeyEnumerationTutorial"

[tool.hatch.version]
path = "sshmitm/__init__.py"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.in"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
production = ["requirements.txt"]
docs = ["doc/requirements.txt"]

[tool.hatch.build]
include = [
    "requirements.in",
    "requirements-build.txt",
    "packaging",
    "sshmitm/**/*.py",
    "sshmitm/data/*.*",
    "sshmitm/apps/mosh/*.*",
    "sshmitm/moduleparser/pluginbrowser/*.tcss",
    "sshmitm/tutorial/static/*.*",
    "sshmitm/tutorial/tutorials/**/*",
]

[tool.hatch.envs.lint]
detached = false
dependencies = [
    "bandit",
    "black~=25.0",
    "Flake8-pyproject",
    "flake8",
    "mypy",
    "pylint",
    "pytest",
    "ruff",
]

[tool.hatch.envs.lint.scripts]
check = [
    "black --check sshmitm",
    "pytest",
    "bandit -r sshmitm",
    "ruff check sshmitm",
    "flake8 sshmitm",
    "pylint sshmitm",
    "mypy sshmitm",
]

[tool.hatch.envs.docs]
detached = false
features = ["docs"]

[tool.hatch.envs.docs.scripts]
build = [
    "sphinx-apidoc -T -e -M -d 1 -o doc/develop/api sshmitm",
    "sphinx-build doc build/html",
]

[tool.appimage]
build_pylock = "pylock.build.toml"

python_date = "20260901"
python_sha256 = "64427febea27864d136db46c8efe968eb6fa5ca2813ce1dca4bb95aec31cb2e4"
pylock = "pylock.toml"

app = "ssh-mitm"
entry_point = "ssh-mitm"
python = "3.11"
icon = "appimage/ssh-mitm.png"
desktop = "appimage/ssh-mitm.desktop"
appimagetool_version = "appimagetool, continuous build (git version 8c8c91f), build 295 built on 2025-12-04 17:56:36 UTC"
appimagetool_sha256 = "a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0"
runtime_sha256 = "1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf"
appimagectl_version = "3.0.0"
extras = ["production"]
update_info = "gh-releases-zsync|ssh-mitm|ssh-mitm|latest|ssh-mitm-x86_64.AppImage.zsync"
appimage_version = "3.0.0"
appimage_sha256 = "f2a2a6d0e4e927c069f9b012e62682a84b6157324acb69692b4c3a23da08f783"
reproducible = true
verify_downloads = true
require_zsyncmake = true

[tool.hatch.envs.appimage]
detached = false
dependencies = ["appimage>=3.0.0"]

[tool.hatch.envs.appimage.scripts]
build = [
    "python -m appimage.ctl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/integration"

[tool.black]
target-version = ["py311"]

[tool.flake8]
# E203/W503 conflict with black's formatting; E704 (one-statement-per-line
# for `def foo(): ...` stubs) is collapsed onto one line by black too, and
# unlike E203/W503 ruff doesn't implement E704 at all, so it can't be
# suppressed per-line via `# noqa` without ruff rejecting the unrecognised
# code (RUF102) — a project-wide ignore is the only option, same rationale
# as the other two.
ignore = ["E203", "E501", "E704", "W503"]

[tool.mypy]
strict = true
install_types = true
non_interactive = true

[tool.pylint]
disable = [
    "cyclic-import",  # sshmitm.tutorial.hosts.logfile_inc: parent package exposes shared
                      # fixtures (Users/Segments) needed by child host modules, while the
                      # parent's own host roster lazily imports those same child modules
                      # (see the `# noqa: PLC0415` local imports in logfile_inc/__init__.py);
                      # pylint also mis-attributes the finding to an unrelated empty module.
    "duplicate-code",
    "fixme",
    "line-too-long",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "too-few-public-methods",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-return-statements",
    "too-many-statements",
]

[tool.pylint.TYPECHECK]
ignored-modules = [
    "sshmitm.apps.mosh.hostinput_pb2",
    "sshmitm.apps.mosh.transportinstruction_pb2",
    "sshmitm.apps.mosh.userinput_pb2",
    "lxml.etree",  # compiled C extension; pylint cannot introspect its members
]

[tool.pylint.MASTER]
load-plugins = "pylint.extensions.docparams"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "A005",    # Module shadows a Python standard-library module
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "COM812",  # Trailing comma missing
    "CPY001",  # Missing copyright notice at top of file (project does not use per-file headers)
    "D",       # Docstring related
    "E501",    # Line too long
    "FA100",   # Missing from __future__ import annotations
    "FBT001",  # Boolean-typed positional argument in function definition
    "FBT002",  # Boolean default positional argument in function definition
    "FBT003",  # Boolean positional value in function call
    "FIX002",  # Line contains TODO, consider resolving the issue
    "LOG015",  # call on root logger
    "N818",    # Exception name `MissingHostException` should be named with an Error suffix
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments in function definition
    "PLR0915", # Too many statements (same family as PLR0911/0912, already ignored)
    "PLR0917", # Too many positional arguments (same family as PLR0913, already ignored)
    "PLR2004", # Magic value used in comparison
    "PTH103",  # `os.makedirs()` should be replaced by `Path.mkdir(parents=True)`
    "PTH107",  # `os.remove()` should be replaced by `Path.unlink()`
    "PTH111",  # `os.path.expanduser()` should be replaced by `Path.expanduser()`
    "PTH113",  # `os.path.isfile()` should be replaced by `Path.is_file()`
    "PTH116",  # `os.stat()` should be replaced by `Path.stat()`, `Path.owner()`, or `Path.group()`
    "PTH118",  # `os.path.join()` should be replaced by `Path` with `/` operator
    "PTH119",  # `os.path.basename()` should be replaced by `Path.name`
    "PTH123",  # `open()` should be replaced by `Path.open()`
    "S104",    # Possible binding to all interfaces
    "SLF001",  # Private member accessed: `_indent`
    "T201",    # `print` found
    "TRY300",  # Consider moving statement to an `else` block (same family as TRY301/400, already ignored)
    "TRY301",  # Abstract `raise` to an inner function
    "TRY400",  # Use `logging.exception` instead of `logging.error`
]
[tool.ruff.lint.per-file-ignores]
"sshmitm/workarounds/monkeypatch.py" = ["ALL"]
"sshmitm/workarounds/transport.py" = ["ALL"]
"sshmitm/apps/mosh/*_pb2.py" = ["ALL"]

[tool.bumpversion]
commit = false
tag = false
tag_name = "{new_version}"

[[tool.bumpversion.files]]
filename = "snapcraft.yaml"

[[tool.bumpversion.files]]
filename = "sshmitm/__init__.py"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "[Unreleased]: https://github.com/ssh-mitm/ssh-mitm/compare/{current_version}...master"
replace = "[Unreleased]: https://github.com/ssh-mitm/ssh-mitm/compare/{new_version}...master\n[{new_version}]: https://github.com/ssh-mitm/ssh-mitm/compare/{current_version}...{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = "## [Unreleased]\n\n## [{new_version}] - {now:%Y-%m-%d}"

[[tool.bumpversion.files]]
filename = "man1/ssh-mitm.1"
search = '"SSH-MITM {current_version}" "SSH-MITM Manual"'
replace = '"SSH-MITM {new_version}" "SSH-MITM Manual"'

[[tool.bumpversion.files]]
filename = "man1/ssh-mitm-audit.1"
search = '"SSH-MITM {current_version}" "SSH-MITM Manual"'
replace = '"SSH-MITM {new_version}" "SSH-MITM Manual"'

[[tool.bumpversion.files]]
filename = "man1/ssh-mitm-server.1"
search = '"SSH-MITM {current_version}" "SSH-MITM Manual"'
replace = '"SSH-MITM {new_version}" "SSH-MITM Manual"'
