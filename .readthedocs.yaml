# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    pre_install:
      # Installing from a pylock.toml (below) needs pip >= 26.1; older
      # pip doesn't recognize the format and errors out trying to parse
      # it as a classic requirements.txt.
      - python -m pip install pip==26.2.1
    pre_build:
      - sphinx-apidoc -T -e -M -d 1 -o doc/develop/api sshmitm


# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: doc/conf.py


# declare the Python requirements required to build your docs
python:
  install:
    - requirements: pylock.docs.toml
    - method: pip
      path: .
